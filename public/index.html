<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScanDy — 매대 맞춤 비교</title>
<style>
  :root {
    --green-1: #0f9b6c;
    --green-2: #13b981;
    --ink: #1f2937;
    --ink-soft: #6b7280;
    --line: #e8eaed;
    --mint: #eafaf2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f1f2f4;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    color: var(--ink);
  }
  .page { max-width: 760px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 24px 20px 64px; }

  header { display: flex; align-items: center; justify-content: space-between;
           padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; color: var(--green-1); }
  .logo span.emoji { font-size: 24px; }
  header .tag { color: var(--ink-soft); font-size: 14px; }

  .panel { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 20px; }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  input[type=file] { font-size: 13px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; border: 1px solid #d6d9dd; border-radius: 10px; font-size: 14px;
  }
  input[type=text]:focus { outline: 2px solid var(--green-2); outline-offset: 1px; border-color: transparent; }
  .run {
    margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
    background: var(--green-1); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .run:disabled { opacity: .45; cursor: not-allowed; }
  .status { margin-top: 10px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .status.error { color: #c0392b; }

  .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid #dcdfe3; color: var(--ink-soft); }
  .chip.p { border-color: #f0b4ae; background: #fdf0ef; color: #c0392b; font-weight: 700; }
  .chip.s { border-color: #f0d9a2; background: #fffaee; color: #9a6b00; font-weight: 700; }

  .best {
    margin-top: 20px; border-radius: 16px; padding: 20px;
    background: linear-gradient(135deg, var(--green-1), var(--green-2)); color: #fff;
  }
  .best .badge {
    display: inline-block; background: #ffc83d; color: #4a3200; font-size: 12px; font-weight: 800;
    padding: 5px 12px; border-radius: 999px; letter-spacing: .04em;
  }
  .best h2 { margin: 12px 0 14px; font-size: 26px; }
  .best .reason { background: rgba(255,255,255,.16); border-radius: 10px; padding: 14px; font-size: 14px; line-height: 1.6; }

  h3.section { font-size: 17px; margin: 28px 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
  h3.section .hint { font-size: 12px; font-weight: 400; color: var(--ink-soft); }

  .scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 13px 14px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  thead th { color: var(--ink-soft); font-weight: 700; background: #fafbfc; }
  tbody tr:last-child td { border-bottom: 0; }
  th:first-child, td:first-child { text-align: left; font-weight: 600; }
  .unit { color: #a0a4ab; font-size: 11px; font-weight: 400; }
  td.win, th.win { background: var(--mint); font-weight: 800; color: #0b7a55; }
  .price-input {
    width: 88px; padding: 5px 8px; border: 1px solid #d6d9dd; border-radius: 7px;
    text-align: right; font-size: 13px; font-family: inherit;
  }

  /* === 목적 기반 하이라이트: 표 어디에도 색을 고정하지 않는다 === */
  tr.hl-primary td, tr.hl-secondary td { background: var(--hl-bg); }
  tr.hl-primary td:first-child, tr.hl-secondary td:first-child {
    box-shadow: inset 3px 0 0 var(--hl-bar);
    color: var(--hl-text);
  }
  tr.hl-primary td.win, tr.hl-secondary td.win { background: var(--mint); color: #0b7a55; }
  tr.hl-primary   { --hl-bar: #e04a3f; --hl-text: #c0392b; --hl-bg: #fdf0ef; }
  tr.hl-secondary { --hl-bar: #e0a52b; --hl-text: #9a6b00; --hl-bg: #fffaee; }

  .legend { margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
  .empty { margin-top: 24px; padding: 40px 20px; text-align: center; color: var(--ink-soft);
           border: 1px dashed #d8dbdf; border-radius: 14px; font-size: 14px; line-height: 1.7; }
  details { margin-top: 28px; }
  summary { font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  pre { background: #fafafa; padding: 12px; border-radius: 8px; font-size: 11px; max-height: 260px; overflow: auto; }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="logo"><span class="emoji">🥗</span>ScanDy</div>
    <div class="tag">매대 맞춤 비교</div>
  </header>

  <div class="panel">
    <div class="field">
      <label for="files">비교할 제품 사진 (제품당 1장)</label>
      <input type="file" id="files" multiple accept="image/*" />
    </div>
    <div class="field">
      <label for="goalText">무엇을 기준으로 고를까요?</label>
      <input type="text" id="goalText"
             placeholder="예) 나트륨 중점으로 비교해줘 / 당이 없었으면 좋겠어 / 가성비 좋은 단백질" />
      <div class="chips" id="chips"></div>
    </div>
    <button class="run" id="run">인식하고 비교하기</button>
    <div class="status" id="status"></div>
  </div>

  <div id="best"></div>
  <div id="compare"></div>
  <div id="debug"></div>

</div>

<script>
/* =========================================================
   설정
   ========================================================= */
const API_BASE = "https://nutrition-vision.onrender.com";
const EXTRACT_URL = `${API_BASE}/api/extract/batch`;
const RECOMMEND_URL = `${API_BASE}/api/recommend`;
const DEFAULT_GOAL = "weight_loss"; // 목적을 못 알아들었을 때 스코어링에 쓸 값

const $ = (id) => document.getElementById(id);

/* =========================================================
   1. 목적 문장 → 강조할 영양소
      색 규칙을 바꾸려면 FOCUS_RULES만 고치면 된다.
   ========================================================= */
const ROW_LABELS = {
  calorie: "열량", protein: "단백질", carbohydrate: "탄수화물", sugar: "ㄴ 당류",
  fat: "지방", sodium: "나트륨", cholesterol: "콜레스테롤",
  price: "판매가", pricePerProtein: "단백질 1g당",
};
const ROW_UNITS = {
  calorie: "/100g", protein: "/100g", carbohydrate: "/100g", sugar: "",
  fat: "/100g", sodium: "/100g", cholesterol: "/100g", price: "", pricePerProtein: "",
};
const ROW_ORDER = ["calorie", "protein", "carbohydrate", "sugar", "fat", "sodium", "cholesterol", "price", "pricePerProtein"];

const FOCUS_RULES = [
  { id: "sodium",      match: ["나트륨", "저염", "소금", "짜", "짠", "혈압"],                 primary: ["sodium"],          secondary: [] },
  { id: "swelling",    match: ["붓기", "부종", "붓는"],                                       primary: ["sodium"],          secondary: ["sugar", "fat"] },
  { id: "sugar",       match: ["당류", "당분", "설탕", "무설탕", "제로", "단맛", "당이", "당은", "당을", "당 "],
                                                                                              primary: ["sugar"],           secondary: ["carbohydrate", "cholesterol"] },
  { id: "blood_sugar", match: ["혈당", "당뇨", "인슐린"],                                      primary: ["sugar"],           secondary: ["carbohydrate"] },
  { id: "calorie",     match: ["칼로리", "열량", "kcal", "다이어트", "체중", "감량", "살빼", "살 빼"],
                                                                                              primary: ["calorie"],         secondary: ["fat", "sugar"] },
  { id: "protein",     match: ["단백질", "프로틴", "근육", "근성장", "벌크", "헬스"],           primary: ["protein"],         secondary: ["pricePerProtein"] },
  { id: "fat",         match: ["지방", "저지방", "기름", "포화지방"],                           primary: ["fat"],             secondary: ["calorie"] },
  { id: "carb",        match: ["탄수", "저탄", "키토", "당질"],                                 primary: ["carbohydrate"],    secondary: ["sugar"] },
  { id: "cholesterol", match: ["콜레스테롤", "고지혈", "혈관", "심혈관"],                        primary: ["cholesterol"],     secondary: ["fat"] },
  { id: "value",       match: ["가성비", "가격", "저렴", "싼", "예산"],                          primary: ["pricePerProtein"], secondary: ["price"] },
];

const GOAL_PRESETS = {
  weight_loss:   { primary: ["calorie"], secondary: ["sugar", "fat"] },
  muscle:        { primary: ["protein"], secondary: ["pricePerProtein"] },
  blood_sugar:   { primary: ["sugar"],   secondary: ["carbohydrate"] },
  anti_swelling: { primary: ["sodium"],  secondary: ["sugar", "fat"] },
};

const RULE_TO_API_GOAL = {
  sodium: "anti_swelling", swelling: "anti_swelling",
  sugar: "blood_sugar", blood_sugar: "blood_sugar", carb: "blood_sugar",
  calorie: "weight_loss", fat: "weight_loss", cholesterol: "weight_loss",
  protein: "muscle", value: "muscle",
};

const EMPTY_FOCUS = { primary: [], secondary: [], matched: [], source: "none" };

function resolveFocus(input) {
  if (!input || typeof input !== "string") return EMPTY_FOCUS;
  const text = input.trim();
  if (!text) return EMPTY_FOCUS;

  if (GOAL_PRESETS[text]) {
    const p = GOAL_PRESETS[text];
    return { primary: [...p.primary], secondary: [...p.secondary], matched: [text], source: "preset" };
  }

  const lower = text.toLowerCase();
  const primary = new Set(), secondary = new Set(), matched = [];
  for (const rule of FOCUS_RULES) {
    if (!rule.match.some((kw) => lower.includes(kw.toLowerCase()))) continue;
    matched.push(rule.id);
    rule.primary.forEach((k) => primary.add(k));
    rule.secondary.forEach((k) => secondary.add(k));
  }
  if (!matched.length) return EMPTY_FOCUS;
  primary.forEach((k) => secondary.delete(k));
  return { primary: [...primary], secondary: [...secondary], matched, source: "text" };
}

function highlightClass(rowKey, focus) {
  if (!focus) return "";
  if (focus.primary.includes(rowKey)) return "hl-primary";
  if (focus.secondary.includes(rowKey)) return "hl-secondary";
  return "";
}

function goalForApi(focus, fallback) {
  for (const id of focus.matched) if (RULE_TO_API_GOAL[id]) return RULE_TO_API_GOAL[id];
  return fallback || DEFAULT_GOAL;
}

/* =========================================================
   2. 입력 미리보기
   ========================================================= */
function renderChips() {
  const focus = resolveFocus($("goalText").value);
  const box = $("chips");
  if (!focus.matched.length) {
    box.innerHTML = $("goalText").value.trim()
      ? `<span class="chip">입력한 목적에서 강조할 항목을 찾지 못했습니다</span>`
      : "";
    return;
  }
  box.innerHTML =
    focus.primary.map((k) => `<span class="chip p">${ROW_LABELS[k].replace("ㄴ ", "")}</span>`).join("") +
    focus.secondary.map((k) => `<span class="chip s">${ROW_LABELS[k].replace("ㄴ ", "")}</span>`).join("");
}
$("goalText").addEventListener("input", renderChips);

/* =========================================================
   3. 상태 + 실행
   ========================================================= */
let state = { products: [], focus: EMPTY_FOCUS, recommendation: "", winner: null };

$("run").addEventListener("click", async () => {
  const files = $("files").files;
  if (!files.length) { setStatus("사진을 최소 1장 선택하세요.", true); return; }

  const focus = resolveFocus($("goalText").value);
  const goal = goalForApi(focus, DEFAULT_GOAL);

  $("run").disabled = true;
  setStatus("사진을 판독하는 중입니다. 몇 초 걸립니다.");
  $("best").innerHTML = ""; $("compare").innerHTML = ""; $("debug").innerHTML = "";

  try {
    const form = new FormData();
    for (const f of files) form.append("images", f);
    const res = await fetch(EXTRACT_URL, { method: "POST", body: form });
    if (!res.ok) throw new Error(`판독 실패 (${res.status})`);
    const batch = await res.json();

    // 100g/ml당 환산이 된 제품만 비교에 쓴다.
    // 포장 크기가 다른 제품을 공정하게 비교하려고 normalize.js가 만들어둔 값이 per100이다.
    const usable = batch.products.filter((p) => p.status !== "failed" && p.normalized?.per100);
    const excluded = batch.products.filter((p) => !usable.includes(p));

    state = {
      products: usable.map((p, i) => ({
        name: p.product?.name || `제품 ${i + 1}`,
        filename: p.filename,
        nutrients: p.normalized.per100,
        price: null,
      })),
      focus,
      recommendation: "",
      winner: null,
    };

    renderCompare();

    const notes = excluded.map((p) =>
      `· ${p.filename}: ${p.status === "failed" ? "판독 실패" : "100g당 환산 불가 (기준 단위 또는 중량 미판독)"}`
    );

    if (state.products.length < 2) {
      setStatus(["비교하려면 판독에 성공한 제품이 2개 이상 필요합니다.", ...notes].join("<br/>"), true);
    } else {
      setStatus([...notes, "순위를 매기는 중입니다."].join("<br/>"));
      const scoreRes = await fetch(RECOMMEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          products: state.products.map((p) => ({ name: p.name, nutrients: p.nutrients })),
          goal,
        }),
      });
      if (!scoreRes.ok) {
        const err = await scoreRes.json().catch(() => ({}));
        throw new Error(`순위 계산 실패 (${scoreRes.status}) ${err.error || ""}`);
      }
      const scored = await scoreRes.json();
      state.winner = scored.ranked?.[0]?.name || null;
      state.recommendation = scored.recommendation || "";
      renderBest();
      renderCompare();
      setStatus([...notes, `비교 기준: 100g당 · 목표: ${goal}`].join("<br/>"));
      $("debug").innerHTML = `<details><summary>원본 응답 보기</summary><pre>${escapeHtml(JSON.stringify({ batch, scored }, null, 2))}</pre></details>`;
    }
  } catch (err) {
    console.error(err);
    setStatus(err.message, true);
  } finally {
    $("run").disabled = false;
  }
});

function setStatus(html, isError) {
  const el = $("status");
  el.className = "status" + (isError ? " error" : "");
  el.innerHTML = html;
}
function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

/* =========================================================
   4. 값 계산
   ========================================================= */
const NUTRIENT_KEYS = {
  calorie: ["calorie", "calories", "kcal", "energy"],
  protein: ["protein"],
  carbohydrate: ["carbohydrate", "carbs", "carb"],
  sugar: ["sugar", "sugars"],
  fat: ["fat", "fats", "totalFat"],
  sodium: ["sodium", "salt"],
  cholesterol: ["cholesterol"],
};
const UNIT_SUFFIX = { calorie: " kcal", protein: "g", carbohydrate: "g", sugar: "g", fat: "g", sodium: "mg", cholesterol: "mg" };

function nutrientOf(product, key) {
  const n = product.nutrients || {};
  for (const k of (NUTRIENT_KEYS[key] || [])) {
    if (n[k] !== undefined && n[k] !== null && n[k] !== "") return Number(n[k]);
  }
  return null;
}

function cellHtml(product, key, index) {
  if (key === "price") {
    return `<input class="price-input" type="number" min="0" step="100" inputmode="numeric"
              data-idx="${index}" value="${product.price ?? ""}" placeholder="원" />`;
  }
  if (key === "pricePerProtein") {
    const protein = nutrientOf(product, "protein");
    if (product.price == null || !protein) return "-";
    return `${Math.round(product.price / protein).toLocaleString()}원/g`;
  }
  const v = nutrientOf(product, key);
  if (v == null || Number.isNaN(v)) return "-";
  return `${Math.round(v * 100) / 100}${UNIT_SUFFIX[key] || ""}`;
}

/* =========================================================
   5. 렌더링
   ========================================================= */
function renderBest() {
  if (!state.winner) { $("best").innerHTML = ""; return; }
  $("best").innerHTML = `
    <div class="best">
      <span class="badge">👑 BEST PICK</span>
      <h2>${escapeHtml(state.winner)}</h2>
      <div class="reason">${escapeHtml(state.recommendation || "입력하신 기준에서 가장 적합한 제품입니다.")}</div>
    </div>`;
}

function renderCompare() {
  const { products, focus } = state;
  if (!products.length) {
    $("compare").innerHTML = `<div class="empty">사진을 올리고 비교 기준을 입력하면<br/>영양성분과 가성비를 나란히 보여드립니다.</div>`;
    return;
  }

  const head = products.map((p) =>
    `<th class="${p.name === state.winner ? "win" : ""}">${escapeHtml(p.name)}${p.name === state.winner ? " (1위)" : ""}</th>`
  ).join("");

  const body = ROW_ORDER.map((key) => {
    const cells = products.map((p, i) =>
      `<td class="${p.name === state.winner ? "win" : ""}">${cellHtml(p, key, i)}</td>`
    ).join("");
    return `<tr class="${highlightClass(key, focus)}" data-key="${key}">
      <td>${ROW_LABELS[key]}${ROW_UNITS[key] ? ` <span class="unit">${ROW_UNITS[key]}</span>` : ""}</td>
      ${cells}
    </tr>`;
  }).join("");

  const legend = focus.matched.length
    ? `<p class="legend">
         <span class="chip p">빨강</span> ${focus.primary.map((k) => ROW_LABELS[k].replace("ㄴ ", "")).join(" · ")}
         ${focus.secondary.length ? `&nbsp;<span class="chip s">노랑</span> ${focus.secondary.map((k) => ROW_LABELS[k].replace("ㄴ ", "")).join(" · ")}` : ""}
       </p>`
    : `<p class="legend">입력한 목적에서 강조할 항목을 찾지 못해 색 표시를 생략했습니다.</p>`;

  $("compare").innerHTML = `
    <h3 class="section">영양성분 &amp; 가성비 상세 비교 <span class="hint">옆으로 스크롤 👉</span></h3>
    <div class="scroll-x">
      <table>
        <thead><tr><th>항목</th>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    ${legend}`;

  $("compare").querySelectorAll(".price-input").forEach((el) => {
    el.addEventListener("change", (e) => {
      const idx = Number(e.target.dataset.idx);
      const v = e.target.value === "" ? null : Number(e.target.value);
      state.products[idx].price = Number.isNaN(v) ? null : v;
      renderCompare();
    });
  });
}

renderChips();
renderCompare();
</script>
</body>
</html>
